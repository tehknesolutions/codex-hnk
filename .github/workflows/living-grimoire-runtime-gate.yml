name: Living Grimoire Runtime Gate
on:
  pull_request:
    paths:
      - 'apps/web/app/laboratorio/**'
      - 'data/library/**'
      - 'data/lab/**'
      - '.github/workflows/living-grimoire-runtime-gate.yml'
  workflow_dispatch:
jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Activate repository pnpm
        run: corepack prepare pnpm@12.1.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install monorepo
        run: pnpm install --frozen-lockfile
      - name: TypeScript gate
        run: pnpm --filter @hnk/web typecheck
      - name: Production build gate
        run: pnpm --filter @hnk/web build
