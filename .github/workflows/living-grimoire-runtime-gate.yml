name: Living Grimoire Runtime Gate
on:
  pull_request:
    paths:
      - 'apps/web/app/laboratorio/**'
      - 'data/library/**'
      - 'data/lab/**'
      - '.github/workflows/living-grimoire-runtime-gate.yml'
  workflow_dispatch:
jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap diagnostics
        run: |
          node --version
          corepack --version || true
          test -f package.json
          test -f pnpm-lock.yaml
          grep -n '"packageManager"' package.json || true
      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version
      - name: Install monorepo
        run: pnpm install --frozen-lockfile
      - name: TypeScript gate
        run: pnpm --filter @hnk/web typecheck
      - name: Production build gate
        run: pnpm --filter @hnk/web build
