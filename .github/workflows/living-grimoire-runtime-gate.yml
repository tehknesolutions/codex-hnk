name: Living Grimoire Runtime Gate
on:
  pull_request:
    paths:
      - 'apps/web/app/laboratorio/**'
      - 'data/library/**'
      - 'data/lab/**'
      - '.github/workflows/living-grimoire-runtime-gate.yml'
  workflow_dispatch:
jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runtime gate with durable report
        id: gate
        shell: bash
        run: |
          set +e
          REPORT=living-grimoire-runtime-report.txt
          : > "$REPORT"
          run_gate () {
            echo "===== $1 =====" | tee -a "$REPORT"
            shift
            "$@" >> "$REPORT" 2>&1
            code=$?
            echo "exit_code=$code" | tee -a "$REPORT"
            return $code
          }
          run_gate NODE node --version || FAILED=NODE
          [ -n "$FAILED" ] || run_gate COREPACK corepack --version || FAILED=COREPACK
          [ -n "$FAILED" ] || run_gate COREPACK_ENABLE corepack enable || FAILED=COREPACK_ENABLE
          [ -n "$FAILED" ] || run_gate PNPM pnpm --version || FAILED=PNPM
          [ -n "$FAILED" ] || run_gate INSTALL pnpm install --frozen-lockfile || FAILED=INSTALL
          [ -n "$FAILED" ] || run_gate TYPECHECK pnpm --filter @hnk/web typecheck || FAILED=TYPECHECK
          [ -n "$FAILED" ] || run_gate BUILD pnpm --filter @hnk/web build || FAILED=BUILD
          echo "failed_stage=${FAILED:-NONE}" | tee -a "$REPORT"
          echo "failed_stage=${FAILED:-NONE}" >> "$GITHUB_OUTPUT"
      - name: Upload runtime report
        uses: actions/upload-artifact@v4
        with:
          name: living-grimoire-runtime-report
          path: living-grimoire-runtime-report.txt
          if-no-files-found: error
      - name: Enforce runtime gate
        if: steps.gate.outputs.failed_stage != 'NONE'
        run: |
          echo "Living Grimoire gate failed at: ${{ steps.gate.outputs.failed_stage }}"
          exit 1
