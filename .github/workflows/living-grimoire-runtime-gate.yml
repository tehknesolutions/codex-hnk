name: Living Grimoire Runtime Gate
on:
  pull_request:
    paths:
      - 'apps/web/app/laboratorio/**'
      - 'data/library/**'
      - 'data/lab/**'
  workflow_dispatch:
jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: TypeScript gate
        run: npx tsc --noEmit
      - name: Production build gate
        run: npm run build
