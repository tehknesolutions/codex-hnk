name: Triad I RC3 DB Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/rc3/**"
      - ".github/workflows/triad-i-rc3-db-gate.yml"

permissions:
  contents: read

jobs:
  postgres17-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hnk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hnk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hnk_ci
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Verify PostgreSQL 17
        run: |
          test "$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "select current_setting('server_version_num')::int between 170000 and 179999")" = "t"

      - name: Materialize RC3 sandbox
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/rc3/schema.sql

      - name: Deterministic progression and portal tests
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/rc3/test.sql

      - name: True concurrent replay and XP race tests
        run: bash tests/rc3/concurrency.sh
