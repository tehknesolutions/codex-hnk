name: HNK Keyboard Android V0.2 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/hnk-keyboard-android-v02/**'
      - '.github/workflows/hnk-keyboard-android-v02-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate HNK vector drawables
        working-directory: tools/hnk-keyboard-android-v02
        run: python3 tools/generate_vectors.py
      - name: Build debug APK
        working-directory: tools/hnk-keyboard-android-v02
        run: gradle --no-daemon assembleDebug
      - name: APK checksum
        run: sha256sum tools/hnk-keyboard-android-v02/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HNK-Keyboard-Android-V02-debug
          path: tools/hnk-keyboard-android-v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
