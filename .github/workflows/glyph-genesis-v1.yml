name: Glyph Genesis V1

on:
  push:
    paths:
      - 'docs/research/mandala/final/glyph-genesis-candidates.v1.json'
      - 'docs/research/mandala/final/glyph-path-transport-profile.v1.json'
      - 'docs/research/mandala/final/glyph-genesis-hnk40-seed-family.v1.json'
      - 'docs/research/mandala/final/glyph-genesis-hnk40-candidates.v1.json'
      - 'scripts/validate-glyph-genesis-v1.mjs'
      - '.github/workflows/glyph-genesis-v1.yml'
  pull_request:
    paths:
      - 'docs/research/mandala/final/glyph-genesis-candidates.v1.json'
      - 'scripts/validate-glyph-genesis-v1.mjs'
      - '.github/workflows/glyph-genesis-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reversible Glyph Genesis candidates
        run: node scripts/validate-glyph-genesis-v1.mjs
