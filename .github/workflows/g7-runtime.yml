name: HNK G7 Runtime Validation

on:
  push:
    branches:
      - migration/m90-unified-v2
    paths:
      - 'apps/mobile/**'
      - 'packages/audio-contract/**'
      - 'packages/supabase-client/**'
      - 'scripts/validate-chokmah-runtime-v2.mjs'
      - 'scripts/validate-aladiah-runtime.mjs'
      - 'scripts/validate-lauviah-runtime.mjs'
      - 'scripts/validate-hahaiah-runtime.mjs'
      - 'scripts/validate-iezalel-runtime.mjs'
      - 'scripts/validate-mebahel-runtime.mjs'
      - 'scripts/validate-chokmah-portal-runtime.mjs'
      - 'scripts/validate-hariel-runtime.mjs'
      - 'scripts/validate-hakamiah-runtime.mjs'
      - 'scripts/validate-binah-lauviah-runtime.mjs'
      - 'scripts/validate-caliel-runtime.mjs'
      - 'scripts/validate-audio-contract.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/g7-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Validate audio contract
        run: pnpm validate:audio

      - name: Validate Chokmah runtime contract
        run: pnpm validate:chokmah

      - name: Validate Aladiah runtime contract
        run: pnpm validate:aladiah

      - name: Validate Lauviah runtime contract
        run: pnpm validate:lauviah

      - name: Validate Hahaiah runtime contract
        run: pnpm validate:hahaiah

      - name: Validate Iezalel runtime contract
        run: pnpm validate:iezalel

      - name: Validate Mebahel runtime contract
        run: pnpm validate:mebahel

      - name: Validate Chokmah Portal runtime contract
        run: pnpm validate:chokmah-portal

      - name: Validate Hariel runtime contract
        run: pnpm validate:hariel

      - name: Validate Hakamiah runtime contract
        run: pnpm validate:hakamiah

      - name: Validate Binah Lauviah runtime contract
        run: pnpm validate:binah-lauviah

      - name: Validate Caliel runtime contract
        run: pnpm validate:caliel

      - name: Typecheck audio contract
        run: pnpm --filter @hnk/audio-contract typecheck

      - name: Typecheck Supabase client
        run: pnpm --filter @hnk/supabase-client typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @hnk/mobile typecheck

      - name: Expo web export smoke
        run: pnpm --filter @hnk/mobile build
