name: HNK Keyboard Android V0.6 Probe Windows

on:
  push:
    branches:
      - build/hnk-keyboard-android-v06-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate validated HNK40 vector drawables
        shell: bash
        working-directory: tools/hnk-keyboard-android-v02
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib
          src = pathlib.Path('tools/vectors.clean.b64')
          raw = base64.b64decode(src.read_text(encoding='utf-8').strip())
          files = json.loads(gzip.decompress(raw).decode('utf-8'))
          expected = [f'glyph_g{i:02d}.xml' for i in range(1,41)]
          if sorted(files) != expected:
              raise SystemExit(f'Unexpected vector set: {len(files)} files')
          out = pathlib.Path('app/src/main/res/drawable')
          out.mkdir(parents=True, exist_ok=True)
          for name in expected:
              (out / name).write_text(files[name], encoding='utf-8')
          print('VECTOR_COUNT=40')
          PY

      - name: Patch isolated V0.6 probe identity
        shell: bash
        working-directory: tools/hnk-keyboard-android-v02
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace("applicationId 'com.hnk.keyboard'", "applicationId 'com.hnk.keyboard.probe'")
          s = s.replace('minSdk 26', 'minSdk 23')
          s = s.replace('versionCode 2', 'versionCode 6')
          s = s.replace("versionName '0.2.0'", "versionName '0.6.0-probe'")
          p.write_text(s, encoding='utf-8')

          m = Path('app/src/main/AndroidManifest.xml')
          s = m.read_text(encoding='utf-8')
          s = s.replace('android:label="HNK Keyboard"', 'android:label="HNK Keyboard V0.6 Probe"')
          s = s.replace('android:name=".HnkInputMethodService"', 'android:name="com.hnk.keyboard.HnkInputMethodService"')
          s = s.replace('android:name=".MainActivity"', 'android:name="com.hnk.keyboard.MainActivity"')
          m.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK
        shell: bash
        working-directory: tools/hnk-keyboard-android-v02
        run: gradle --no-daemon clean :app:assembleDebug

      - name: APK checksum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tools/hnk-keyboard-android-v02/app/build/outputs/apk/debug/app-debug.apk')
          if not p.is_file():
              raise SystemExit('APK missing')
          print('SIZE=', p.stat().st_size)
          print('SHA256=', hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: HNK-Keyboard-Android-V06-Probe-Windows-debug
          path: tools/hnk-keyboard-android-v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
