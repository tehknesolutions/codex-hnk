name: Day 001 Golden Gate

on:
  push:
    branches:
      - fix/golden-lockfile-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Day 001 runner probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner alive
        run: echo "DAY001 RUNNER PROBE PASS"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repository structure
        run: |
          git rev-parse HEAD
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f apps/web/package.json
          echo "DAY001 REPOSITORY PROBE PASS"
