name: Day 001 Golden Gate

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/day001-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Day 001 environment probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repository probe
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          git rev-parse HEAD
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f apps/web/package.json
          ls -la

  bootstrap-lock:
    name: Day 001 lockfile bootstrap
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Toolchain probe
        run: |
          node --version
          pnpm --version
      - name: Generate lockfile only when absent
        shell: bash
        run: |
          set -euxo pipefail
          if [[ ! -f pnpm-lock.yaml ]]; then
            pnpm install --lockfile-only --no-frozen-lockfile
          fi
          test -s pnpm-lock.yaml
      - name: Upload canonical lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-candidate
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

  web-golden:
    name: Day 001 web frozen install + typecheck + build
    needs: bootstrap-lock
    if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm exec tsc --noEmit
      - working-directory: apps/web
        run: pnpm build
