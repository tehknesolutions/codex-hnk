name: Day 001 Golden Gate

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'docs/experience/kether/day-001/**'
      - 'docs/backend-drafts/**'
      - 'packages/quest-engine/**'
      - 'packages/completion-contract/**'
      - 'packages/practice-contract/**'
      - 'packages/canon-resolver/**'
      - 'packages/quest-pack/**'
      - 'packages/visual-contract/**'
      - 'packages/supabase-client/**'
      - 'packages/ritual-tone/**'
      - 'assets/canonical/kether/**'
      - 'assets/derived/kether/**'
      - 'supabase/**'
      - 'scripts/validate-day001-*.mjs'
      - 'scripts/validate-practice-contract.mjs'
      - 'scripts/validate-completion-backend-v2.mjs'
      - 'scripts/verify-day001-canon-source.mjs'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/day001-golden.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'docs/experience/kether/day-001/**'
      - 'docs/backend-drafts/**'
      - 'packages/quest-engine/**'
      - 'packages/completion-contract/**'
      - 'packages/practice-contract/**'
      - 'packages/canon-resolver/**'
      - 'packages/quest-pack/**'
      - 'packages/visual-contract/**'
      - 'packages/supabase-client/**'
      - 'packages/ritual-tone/**'
      - 'assets/canonical/kether/**'
      - 'assets/derived/kether/**'
      - 'supabase/**'
      - 'scripts/validate-day001-*.mjs'
      - 'scripts/validate-practice-contract.mjs'
      - 'scripts/validate-completion-backend-v2.mjs'
      - 'scripts/verify-day001-canon-source.mjs'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/day001-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-day-001:
    name: Golden Day 001 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout HNK Codex
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch canonical Day 001 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Tehkne-Solutions/hnk-codex-365/main/canon/capitulo-01-kether/dia-001.md' \
            --output "$RUNNER_TEMP/day001-canon.md"
          test -s "$RUNNER_TEMP/day001-canon.md"

      - name: Run Golden Day integrity gate
        id: golden
        shell: bash
        env:
          HNK_DAY001_CANON_SOURCE: ${{ runner.temp }}/day001-canon.md
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/day001-golden-diagnostics"
          node scripts/validate-day001-golden.mjs 2>&1 | tee "$RUNNER_TEMP/day001-golden-diagnostics/golden.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/day001-golden-diagnostics/exit-code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Golden diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day001-golden-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/day001-golden-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Golden result
        if: always()
        shell: bash
        run: |
          code='${{ steps.golden.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'DAY001 GOLDEN FAIL: validator exit code was not captured'
            exit 1
          fi
          if [ "$code" != '0' ]; then
            echo "DAY001 GOLDEN FAIL: validators returned $code; diagnostics artifact uploaded"
            exit "$code"
          fi
          echo 'DAY001 GOLDEN PASS: diagnostics artifact uploaded'

  runtime-build:
    name: Golden Day 001 runtime build
    needs: golden-day-001
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout HNK Codex
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck contracts and adapters
        run: |
          pnpm --filter @hnk/completion-contract typecheck
          pnpm --filter @hnk/practice-contract typecheck
          pnpm --filter @hnk/ritual-tone typecheck
          pnpm --filter @hnk/supabase-client typecheck

      - name: Test ritual tone
        run: pnpm --filter @hnk/ritual-tone test

      - name: Typecheck active clients
        run: |
          pnpm --filter @hnk/web typecheck
          pnpm --filter @hnk/mobile typecheck

      - name: Build Web Golden V2
        run: pnpm --filter @hnk/web build

      - name: Build Mobile Golden V2 web export
        run: pnpm --filter @hnk/mobile build
