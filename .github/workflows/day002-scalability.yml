name: Day 002 Scalability Gate

on:
  push:
    branches:
      - main
    paths:
      - 'docs/experience/kether/day-002/**'
      - 'docs/audio/**'
      - 'docs/progression/**'
      - 'docs/architecture/HNK_ATTRIBUTE_PROGRESSION_MATRIX_V1.md'
      - 'packages/quest-engine/**'
      - 'packages/quest-library/**'
      - 'packages/completion-contract/**'
      - 'packages/practice-contract/**'
      - 'packages/progression/**'
      - 'packages/audio-contract/**'
      - 'packages/supabase-client/**'
      - 'apps/web/app/day-002/**'
      - 'apps/web/app/_runtime/**'
      - 'apps/mobile/src/app/day-002.tsx'
      - 'apps/mobile/src/features/kether/Day002GoldenV1Mobile.tsx'
      - 'apps/mobile/src/features/kether/day002-audio-runtime.ts'
      - 'apps/mobile/src/runtime/**'
      - 'supabase/migrations/*day002*'
      - 'supabase/migrations/*attribute_progression*'
      - 'scripts/validate-day002-scalability.mjs'
      - 'scripts/validate-day002-audio.mjs'
      - 'scripts/validate-quest-audio-runtime.mjs'
      - 'scripts/validate-day002-runtime-integration.mjs'
      - 'scripts/validate-quest-catalog-scalability.mjs'
      - 'scripts/validate-attribute-progression-matrix.mjs'
      - 'scripts/verify-day002-canon-source.mjs'
      - 'package.json'
      - '.github/workflows/day002-scalability.yml'
  pull_request:
    paths:
      - 'docs/experience/kether/day-002/**'
      - 'docs/audio/**'
      - 'docs/progression/**'
      - 'docs/architecture/HNK_ATTRIBUTE_PROGRESSION_MATRIX_V1.md'
      - 'packages/quest-engine/**'
      - 'packages/quest-library/**'
      - 'packages/completion-contract/**'
      - 'packages/practice-contract/**'
      - 'packages/progression/**'
      - 'packages/audio-contract/**'
      - 'packages/supabase-client/**'
      - 'apps/web/app/day-002/**'
      - 'apps/web/app/_runtime/**'
      - 'apps/mobile/src/app/day-002.tsx'
      - 'apps/mobile/src/features/kether/Day002GoldenV1Mobile.tsx'
      - 'apps/mobile/src/features/kether/day002-audio-runtime.ts'
      - 'apps/mobile/src/runtime/**'
      - 'supabase/migrations/*day002*'
      - 'supabase/migrations/*attribute_progression*'
      - 'scripts/validate-day002-scalability.mjs'
      - 'scripts/validate-day002-audio.mjs'
      - 'scripts/validate-quest-audio-runtime.mjs'
      - 'scripts/validate-day002-runtime-integration.mjs'
      - 'scripts/validate-quest-catalog-scalability.mjs'
      - 'scripts/validate-attribute-progression-matrix.mjs'
      - 'scripts/verify-day002-canon-source.mjs'
      - 'package.json'
      - '.github/workflows/day002-scalability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalability-contracts:
    name: Day 002 configuration audio and runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch canonical Day 002 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Tehkne-Solutions/hnk-codex-365/main/canon/capitulo-01-kether/dia-002.md' \
            --output "$RUNNER_TEMP/day002-canon.md"
          test -s "$RUNNER_TEMP/day002-canon.md"
      - name: Verify raw Day 002 Canon
        run: node scripts/verify-day002-canon-source.mjs "$RUNNER_TEMP/day002-canon.md"
      - name: Validate Day 002 scalability
        run: node scripts/validate-day002-scalability.mjs
      - name: Validate deterministic Day 002 audio
        run: node scripts/validate-day002-audio.mjs
      - name: Validate generic Quest audio runtime
        run: node scripts/validate-quest-audio-runtime.mjs
      - name: Validate Day 002 Web Expo runtime integration
        run: node scripts/validate-day002-runtime-integration.mjs
      - name: Validate multi-day Quest Catalog
        run: node scripts/validate-quest-catalog-scalability.mjs
      - name: Validate Attribute Progression Matrix V1
        run: node scripts/validate-attribute-progression-matrix.mjs

  engine-typecheck:
    name: Day 002 engine library and runtime typecheck
    needs: scalability-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @hnk/quest-engine typecheck
      - run: pnpm --filter @hnk/quest-library typecheck
      - run: pnpm --filter @hnk/completion-contract typecheck
      - run: pnpm --filter @hnk/practice-contract typecheck
      - run: pnpm --filter @hnk/progression typecheck
      - run: pnpm --filter @hnk/audio-contract typecheck
      - run: pnpm --filter @hnk/supabase-client typecheck
      - run: pnpm --filter @hnk/web typecheck
      - run: pnpm --filter @hnk/mobile typecheck
