name: HNK Native Vault Android Interop Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/features/vault/NativeVaultInteropHarness.ts'
      - 'apps/mobile/src/app/labs/vault-interop.tsx'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'packages/vault-interop-vectors/**'
      - 'pnpm-lock.yaml'
      - 'scripts/run-vault-native-android-interop.sh'
      - 'scripts/validate-vault-native-interop.mjs'
      - '.github/workflows/vault-native-android-interop.yml'

permissions:
  contents: read

jobs:
  android-native-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_PUBLIC_HNK_NATIVE_INTEROP_AUTORUN: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Validate shared Native interop contract
        run: pnpm validate:vault-native-interop

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute frozen vector in Android native runtime
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: sh scripts/run-vault-native-android-interop.sh

      - name: Upload redacted Android interop proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnk-native-vault-android-interop-v1
          path: artifacts/native-android-interop
          retention-days: 30
          if-no-files-found: warn
