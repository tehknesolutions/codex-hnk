name: HNK Keyboard Android V0.6 Probe Build

on:
  push:
    branches:
      - build/hnk-keyboard-android-v06-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate and validate HNK40 vector drawables
        working-directory: tools/hnk-keyboard-android-v02
        run: |
          python3 - <<'PY'
          import base64, gzip, json, pathlib, hashlib
          src = pathlib.Path('tools/vectors.clean.b64')
          encoded = src.read_text(encoding='ascii').strip()
          raw = gzip.decompress(base64.b64decode(encoded))
          files = json.loads(raw.decode('utf-8'))
          if not isinstance(files, dict) or len(files) != 40:
              raise SystemExit(f'Expected 40 vector drawables, got {len(files) if isinstance(files, dict) else type(files)}')
          expected = [f'glyph_g{i:02d}.xml' for i in range(1,41)]
          actual = sorted(files.keys())
          if actual != expected:
              raise SystemExit(f'Unexpected drawable names: {actual[:3]} ... {actual[-3:]}')
          out = pathlib.Path('app/src/main/res/drawable')
          out.mkdir(parents=True, exist_ok=True)
          for name in expected:
              content = files[name]
              if '<vector' not in content or '</vector>' not in content:
                  raise SystemExit(f'Invalid VectorDrawable: {name}')
              (out / name).write_text(content, encoding='utf-8')
          print('VECTOR_COUNT=40')
          print('ARCHIVE_GZIP_SHA256=' + hashlib.sha256(gzip.compress(raw, mtime=0)).hexdigest())
          PY

      - name: Patch isolated V0.6 probe identity
        working-directory: tools/hnk-keyboard-android-v02
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace("applicationId 'com.hnk.keyboard'", "applicationId 'com.hnk.keyboard.probe'")
          s = s.replace('minSdk 26', 'minSdk 23')
          s = s.replace('versionCode 2', 'versionCode 6')
          s = s.replace("versionName '0.2.0'", "versionName '0.6.0-probe'")
          p.write_text(s, encoding='utf-8')

          m = Path('app/src/main/AndroidManifest.xml')
          s = m.read_text(encoding='utf-8')
          s = s.replace('android:label="HNK Keyboard"', 'android:label="HNK Keyboard V0.6 Probe"')
          s = s.replace('android:name=".HnkInputMethodService"', 'android:name="com.hnk.keyboard.HnkInputMethodService"')
          s = s.replace('android:name=".MainActivity"', 'android:name="com.hnk.keyboard.MainActivity"')
          m.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK with Gradle
        working-directory: tools/hnk-keyboard-android-v02
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Validate APK structure and signature
        run: |
          APK=tools/hnk-keyboard-android-v02/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          sha256sum "$APK"
          stat -c 'SIZE=%s' "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: HNK-Keyboard-Android-V06-Probe-debug
          path: tools/hnk-keyboard-android-v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
