<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">A Coroa Antes da Forma — Day 001 Key Art V1</title>
<desc id="desc">Text-free HNK key art for Day 001: a point of origin, concentric emergence, a north axis and a three-ray crown suspended in a dark cosmic field.</desc>
<defs>
  <radialGradient id="voidGlow" cx="50%" cy="72%" r="68%">
    <stop offset="0%" stop-color="#1b1630"/>
    <stop offset="48%" stop-color="#090713"/>
    <stop offset="100%" stop-color="#020204"/>
  </radialGradient>
  <radialGradient id="originLight">
    <stop offset="0%" stop-color="#fff8d8" stop-opacity="1"/>
    <stop offset="32%" stop-color="#f4d98f" stop-opacity=".82"/>
    <stop offset="100%" stop-color="#d5b460" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="axisGold" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#fff8d8" stop-opacity=".28"/>
    <stop offset="55%" stop-color="#d8b85d" stop-opacity=".72"/>
    <stop offset="100%" stop-color="#f6df99" stop-opacity=".95"/>
  </linearGradient>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="fineGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect width="1200" height="1600" fill="url(#voidGlow)"/>

<g opacity=".23" fill="#e7cf84">
  <circle cx="172" cy="228" r="2"/><circle cx="928" cy="194" r="1.8"/><circle cx="1034" cy="396" r="1.5"/>
  <circle cx="244" cy="518" r="1.3"/><circle cx="1084" cy="734" r="2.1"/><circle cx="128" cy="842" r="1.4"/>
  <circle cx="956" cy="1044" r="1.3"/><circle cx="302" cy="1168" r="1.6"/><circle cx="842" cy="1308" r="1.2"/>
  <circle cx="512" cy="210" r="1.2"/><circle cx="702" cy="422" r="1.4"/><circle cx="420" cy="716" r="1.1"/>
</g>

<ellipse cx="600" cy="1190" rx="280" ry="280" fill="url(#originLight)" opacity=".32" filter="url(#softGlow)"/>

<g fill="none" stroke="#d8b85d">
  <circle cx="600" cy="1190" r="390" stroke-width="2" opacity=".13"/>
  <circle cx="600" cy="1190" r="270" stroke-width="2" opacity=".18"/>
  <circle cx="600" cy="1190" r="150" stroke-width="2" opacity=".26"/>
</g>

<line x1="600" y1="1190" x2="600" y2="530" stroke="url(#axisGold)" stroke-width="4" opacity=".86"/>
<line x1="600" y1="1190" x2="600" y2="530" stroke="#f8e8ad" stroke-width="14" opacity=".08" filter="url(#fineGlow)"/>

<g fill="none" stroke="#e3c86f" stroke-linecap="round" stroke-linejoin="round">
  <path d="M370 490 L468 360 L552 462 L600 250 L648 462 L732 360 L830 490" stroke-width="8" opacity=".95"/>
  <line x1="430" y1="525" x2="770" y2="525" stroke-width="4" opacity=".62"/>
</g>

<g fill="#f7e9b4">
  <circle cx="600" cy="1190" r="12"/>
  <circle cx="600" cy="250" r="7" opacity=".92"/>
</g>

<circle cx="600" cy="1190" r="52" fill="none" stroke="#fff1bf" stroke-width="2" opacity=".34"/>
<circle cx="600" cy="1190" r="78" fill="none" stroke="#d8b85d" stroke-width="2" opacity=".18"/>

<g opacity=".11" fill="none" stroke="#e0c670" stroke-width="1.5">
  <path d="M250 1185 C390 1050 810 1050 950 1185"/>
  <path d="M300 1280 C450 1380 750 1380 900 1280"/>
  <path d="M430 710 C500 650 700 650 770 710"/>
</g>
</svg>
