<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 265" role="img" aria-labelledby="title desc">
  <title id="title">Cockpit Gneo Geo — recovered project schematic candidate</title>
  <desc id="desc">Non-canonical source-recovery candidate reconstructed from the HNK project transcript. Double mirrored triangle, cardinal axes and eight numbered cockpit nodes. Not approved as Bluefluke-original provenance.</desc>

  <rect width="500" height="265" fill="#020408"/>

  <!-- Recovered core: protective/cockpit circle + mirrored Goetic triangles -->
  <g fill="none">
    <circle cx="250" cy="132" r="105" stroke="#00d2ff" stroke-width="1.2" stroke-dasharray="6 3"/>
    <polygon points="250,27 335,178 165,178" stroke="#ffd700" stroke-width="2"/>
    <polygon points="250,237 165,86 335,86" stroke="#ffd700" stroke-width="2"/>

    <!-- Recovered north-south/east-west axes -->
    <line x1="250" y1="12" x2="250" y2="252" stroke="#ff8800" stroke-width="1.5"/>
    <line x1="130" y1="132" x2="370" y2="132" stroke="#ff8800" stroke-width="1.5"/>
  </g>

  <!-- Recovered numbered cockpit slots. Labels are source-recovery metadata, not a claim that these equal the 8 Circuits of Consciousness. -->
  <g font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <g data-node="1" data-label="Superconsciência">
      <circle cx="290" cy="100" r="10" fill="#ffd700" stroke="#000"/>
      <text x="290" y="104" fill="#000">1</text>
    </g>
    <g data-node="2" data-label="Consciência">
      <circle cx="250" cy="170" r="10" fill="#ff7300" stroke="#fff"/>
      <text x="250" y="174" fill="#fff">2</text>
    </g>
    <g data-node="3" data-label="Subconsciente">
      <circle cx="210" cy="100" r="10" fill="#00d2ff" stroke="#000"/>
      <text x="210" y="104" fill="#000">3</text>
    </g>
    <g data-node="4" data-label="Multi-Sigilo">
      <circle cx="250" cy="120" r="11" fill="#fff" stroke="#000"/>
      <text x="250" y="124" fill="#000">4</text>
    </g>
    <g data-node="5" data-label="Temperamento">
      <circle cx="180" cy="140" r="9" fill="#00d2ff" stroke="#fff"/>
      <text x="180" y="143" fill="#000">5</text>
    </g>
    <g data-node="6" data-label="Tarefa Principal">
      <circle cx="250" cy="48" r="9" fill="#ffd700" stroke="#000"/>
      <text x="250" y="51" fill="#000">6</text>
    </g>
    <g data-node="7" data-label="Longevidade">
      <circle cx="320" cy="140" r="9" fill="#00d2ff" stroke="#fff"/>
      <text x="320" y="143" fill="#000">7</text>
    </g>
    <g data-node="8" data-label="Nome / Circuito 8">
      <circle cx="250" cy="92" r="10" fill="#a85218" stroke="#ffd700"/>
      <text x="250" y="96" fill="#fff">8</text>
    </g>
  </g>

  <text x="250" y="258" fill="#8aa7b7" font-family="monospace" font-size="8" text-anchor="middle">HNK SOURCE RECOVERY · NOT CANON · PROVENANCE REVIEW REQUIRED</text>
</svg>
